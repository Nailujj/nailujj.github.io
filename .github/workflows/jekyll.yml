# Builds the site with Jekyll 4 and publishes it to GitHub Pages.
# GitHub's own Pages builder is stuck on Jekyll 3, hence the explicit build here.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v5

      # This repo is nailujj.github.io, a user page served at the root, so the build
      # takes the empty baseurl from _config.yml. Do not pass configure-pages'
      # base_path here: it reports "/<repo>", and that prefix 404s on a user page.
      # A project page (any other repo name, no custom domain) would need it back.
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
