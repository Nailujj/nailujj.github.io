<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Hexagonale Brillouin-Zone">
  <title>Julian Schmid</title>
  <!-- The hexagonal Brillouin zone: Gamma at the centre, and three of the six corners marked,
       because K and K' alternate around the zone. Colours are the hero's orientation palette. -->
  <polygon points="91,50 70.5,14.5 29.5,14.5 9,50 29.5,85.5 70.5,85.5"
           fill="#f2f0ea" stroke="#1c1c1c" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="84" cy="50" r="7.5" fill="#d8402c"/>
  <circle cx="33" cy="20.5" r="7.5" fill="#3a6fd8"/>
  <circle cx="33" cy="79.5" r="7.5" fill="#4a9e6b"/>
  <circle cx="50" cy="50" r="10" fill="#1c1c1c"/>
</svg>
